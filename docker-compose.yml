services:
  postgres:
    image: postgres:16
    container_name: pct_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pct_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: pct_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides backend/.env's DATABASE_URL (meant for running the backend
      # directly on the host), which is unreachable from inside this container:
      # "localhost" here would mean the container itself, not the postgres
      # service.
      - DATABASE_URL=postgresql+psycopg://pct_user:pct_password@postgres:5432/pct
      # Shared HMAC secret used to sign/verify the internal service tokens that
      # frontend and ai_service present in place of a raw user email. Must be
      # identical across backend, frontend, and ai_service.
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: pct_frontend
    restart: unless-stopped
    environment:
      - FASTAPI_BASE_URL=http://backend:8000
      - AI_SERVICE_BASE_URL=http://ai_service:8001
      # Shared HMAC secret used to sign the internal service tokens sent to the
      # backend in place of a raw user email. Must match backend's value.
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
    ports:
      - "8001:8001"
    volumes:
      - ./frontend/templates:/app/templates
      - ./frontend/core/templates:/app/core/templates
      - ./frontend/core/templatetags:/app/core/templatetags
    depends_on:
      - backend

  chromadb:
    image: chromadb/chroma:latest
    container_name: pct_chromadb
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - pct_chromadb_data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: pct_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pct_ollama_data:/root/.ollama

  ai_service:
    build:
      context: ./ai_service
    container_name: pct_ai_service
    restart: unless-stopped
    env_file:
      - ./ai_service/.env
    environment:
      # Overrides ai_service/.env's BACKEND_API_URL (meant for running ai_service
      # directly on the host), which is unreachable from inside this container:
      # "localhost" here would mean the container itself, not the backend
      # service.
      - BACKEND_API_URL=http://backend:8000
      - CHROMADB_URL=http://chromadb:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      # Shared HMAC secret used to sign the internal service tokens sent to the
      # backend in place of a raw user email. Must match backend's value.
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
    ports:
      - "8002:8001"
    depends_on:
      - backend
      - chromadb
      - ollama

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: pct_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # Docker Desktop on macOS exposes /var/run/docker.sock as a symlink to a path
      # outside /var/run (~/.docker/run/docker.sock); mounting the directory alone
      # carries the broken symlink in, so the socket is mounted explicitly here too.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
      - backend
      - frontend
      - ai_service

  prometheus:
    image: prom/prometheus:latest
    container_name: pct_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - backend
      - frontend
      - ai_service
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: pct_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pct_postgres_data:
  pct_chromadb_data:
  pct_ollama_data:
