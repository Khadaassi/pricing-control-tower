services:
  ai_service:
    build:
      context: ./ai_service
    container_name: pct_ai_service
    restart: unless-stopped
    env_file:
      - ./ai_service/.env
    ports:
      - "8001:8001"

  prometheus:
    image: prom/prometheus:latest
    container_name: pct_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - ai_service
