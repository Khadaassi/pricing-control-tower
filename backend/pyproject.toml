[project]
name = "pct-backend"
version = "0.1.0"
description = "Pricing Control Tower - Backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.4",
    "dbt-core>=1.11.8",
    "dbt-postgres>=1.10.0",
    "fastapi>=0.135.3",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]  # erreurs, flake, imports
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
