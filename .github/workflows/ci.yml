name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d ci_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ci_db
      INTERNAL_AUTH_SECRET: test_internal_auth_secret
      # TestClient(app) is used without a context manager in this test suite, so
      # startup events (and thus the scheduler) never actually fire in pytest —
      # this is set for documentation/defense-in-depth, not because CI needs it.
      GDPR_RETENTION_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Show Python version
        run: python --version

      - name: Check backend folder exists
        run: test -d backend

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Create PostgreSQL schemas
        working-directory: backend
        run: |
          uv run python - <<'PY'
          from sqlalchemy import text
          from app.db import engine

          with engine.begin() as connection:
              connection.execute(text("CREATE SCHEMA IF NOT EXISTS pct_core"))
              connection.execute(text("CREATE SCHEMA IF NOT EXISTS pct_analytics"))
          PY

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run lint with Ruff
        working-directory: backend
        run: uv run ruff check app tests

      - name: Verify backend startup
        working-directory: backend
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  ai-service-tests:
    name: AI service tests
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: test_groq_key
      # PyJWT rejects an empty HMAC key (InvalidKeyError) — without this,
      # every test touching issue_service_token/decode_service_token errors
      # out, since Settings.internal_auth_secret defaults to "" when unset.
      # Same value convention as frontend-ci/backend-ci below.
      INTERNAL_AUTH_SECRET: test_internal_auth_secret

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run AI service lint
        run: uv run ruff check .

      - name: Run AI service tests (with coverage gate)
        # fail_under is set in pyproject.toml [tool.coverage.report] — see
        # docs/08_certification/E3_rapport_api_modele_ia.md §5.4 for how that
        # number was derived from a real measurement, not chosen upfront.
        run: uv run pytest --cov=app --cov-report=term-missing

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test_django_secret_key
      DJANGO_DEBUG: "False"
      INTERNAL_AUTH_SECRET: test_internal_auth_secret
      # No backend/ai_service running in this job — deliberately unreachable.
      # The frontend test suite mocks outbound calls and handles connection
      # failures gracefully, so no live FastAPI backend is needed here.
      FASTAPI_BASE_URL: http://127.0.0.1:9
      AI_SERVICE_BASE_URL: http://127.0.0.1:9

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run frontend lint
        run: uv run ruff check .

      - name: Check for missing Django migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply Django migrations
        run: uv run python manage.py migrate --noinput

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tailwind dependencies
        working-directory: frontend/theme/static_src
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: frontend/theme/static_src
        run: npm run build

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput

      - name: Run frontend tests
        run: uv run python manage.py test

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-ci, ai-service-tests, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pct-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t pct-frontend:ci ./frontend

      - name: Build ai_service image
        run: docker build -t pct-ai-service:ci ./ai_service

  deploy-gcp:
    name: Deploy to GCP (pct-app-vm)
    runs-on: ubuntu-latest
    needs: [docker-build]
    # The VM tracks develop (see docs/07_operations/gcp_exploitation_runbook.md
    # §4) — a push to any other branch, or a pull_request event, must never
    # trigger a real deployment. workflow_dispatch allows an on-demand redeploy
    # without a new commit. Was feature/gcp-deployment until that branch was
    # merged into develop and deleted (git-flow feature finish).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation (no static key)

    env:
      GCP_PROJECT: elite-ceremony-503918-i8
      GCP_ZONE: europe-west1-b
      GCP_VM: pct-app-vm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA_EMAIL }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Redeploy on pct-app-vm
        # Same steps as the manual procedure in
        # docs/07_operations/gcp_exploitation_runbook.md §4 (git pull, refresh
        # secrets, rebuild only what changed), run entirely under sudo: the
        # deployer's OS Login POSIX account is not the account /opt/pct was
        # originally cloned under (unlike the human admin's), so it has no
        # write access to it without sudo — the manual procedure only needed
        # sudo for the final `docker compose` step.
        run: |
          gcloud compute ssh "$GCP_VM" \
            --zone="$GCP_ZONE" \
            --project="$GCP_PROJECT" \
            --tunnel-through-iap \
            --command="
              sudo git config --global --add safe.directory /opt/pct &&
              cd /opt/pct && sudo git pull &&
              sudo /opt/pct/infra/compose/fetch-secrets.sh &&
              cd /opt/pct/infra/compose &&
              sudo docker compose -f docker-compose.gcp.yml --env-file .env up -d --build
            "

      - name: Post-deploy health check
        # Same endpoints as the runbook's §5 "From outside" checks. Retries
        # because containers can take a few seconds to report healthy after
        # `up -d --build` returns.
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://104.155.34.3:8001/health && curl -sf http://104.155.34.3:3000/api/health; then
              echo "Health checks passed."
              exit 0
            fi
            echo "Waiting for services to become healthy... ($i/10)"
            sleep 15
          done
          echo "Post-deploy health check failed." >&2
          exit 1