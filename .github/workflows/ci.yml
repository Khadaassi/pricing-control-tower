name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d ci_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ci_db
      INTERNAL_AUTH_SECRET: test_internal_auth_secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Show Python version
        run: python --version

      - name: Check backend folder exists
        run: test -d backend

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups

      - name: Create PostgreSQL schemas
        working-directory: backend
        run: |
          uv run python - <<'PY'
          from sqlalchemy import text
          from app.db import engine

          with engine.begin() as connection:
              connection.execute(text("CREATE SCHEMA IF NOT EXISTS pct_core"))
              connection.execute(text("CREATE SCHEMA IF NOT EXISTS pct_analytics"))
          PY

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run lint with Ruff
        working-directory: backend
        run: uv run ruff check app tests

      - name: Verify backend startup
        working-directory: backend
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  ai-service-tests:
    name: AI service tests
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: test_groq_key

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run AI service lint
        run: uv run ruff check .

      - name: Run AI service tests
        run: uv run pytest

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: test_django_secret_key
      DJANGO_DEBUG: "False"
      INTERNAL_AUTH_SECRET: test_internal_auth_secret
      # No backend/ai_service running in this job — deliberately unreachable.
      # The frontend test suite mocks outbound calls and handles connection
      # failures gracefully, so no live FastAPI backend is needed here.
      FASTAPI_BASE_URL: http://127.0.0.1:9
      AI_SERVICE_BASE_URL: http://127.0.0.1:9

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run frontend lint
        run: uv run ruff check .

      - name: Check for missing Django migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply Django migrations
        run: uv run python manage.py migrate --noinput

      - name: Run frontend tests
        run: uv run python manage.py test

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-ci, ai-service-tests, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pct-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t pct-frontend:ci ./frontend

      - name: Build ai_service image
        run: docker build -t pct-ai-service:ci ./ai_service