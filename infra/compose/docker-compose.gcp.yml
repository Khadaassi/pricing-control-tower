# Production overlay for pct-app-vm. Kept separate from the root
# docker-compose.yml (local dev) instead of merged, since Cloud SQL replaces
# the local `postgres` service entirely rather than just overriding it.
# Grows service-by-service across T214/T215/T216/T217.
services:
  backend:
    build:
      context: ../../backend
    container_name: pct_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,sys,urllib.request; d=json.loads(urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()); sys.exit(0 if d.get('status') == 'ok' else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ../../frontend
    container_name: pct_frontend
    restart: unless-stopped
    environment:
      - FASTAPI_BASE_URL=http://backend:8000
      # ai_service isn't deployed yet (T216) — chatbot calls will fail until
      # then, everything else (auth, dashboards, health) works fine.
      - AI_SERVICE_BASE_URL=http://ai_service:8001
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?INTERNAL_AUTH_SECRET must be set}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_HTTPS_ENABLED=${DJANGO_HTTPS_ENABLED:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS must be set}
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:?DJANGO_CSRF_TRUSTED_ORIGINS must be set}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
