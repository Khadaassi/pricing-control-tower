global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "ai_service"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ai_service:8001"

  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "backend:8000"

  - job_name: "frontend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "frontend:8001"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
