
{% if image_url %}
    <img
        src="{{ image_url }}"
        alt="{{ name }}"
        class="h-12 w-12 rounded-xl object-cover border border-gray-100 bg-gray-50"
        loading="lazy"
    >
{% else %}
    <div class="flex h-12 w-12 items-center justify-center rounded-xl border border-dashed border-gray-200 bg-gray-50 text-[10px] text-gray-400" aria-label="No image available">
        <svg class="h-5 w-5 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
    </div>
{% endif %}
