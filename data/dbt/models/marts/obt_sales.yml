version: 2

models:
  - name: obt_sales
    description: "One Big Table — fully denormalized sales fact with all dimensions for analytics"
    columns:
      - name: transaction_id
        description: "Primary key — unique sale transaction"
        tests:
          - unique
          - not_null
      - name: transaction_date
        tests:
          - not_null
      - name: transaction_day
        description: "Transaction date cast to date (no time)"
        tests:
          - not_null
      - name: transaction_month
        description: "First day of the transaction month"
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: product_code
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: store_id
        tests:
          - not_null
      - name: store_code
        tests:
          - not_null
      - name: store_name
        tests:
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: country_name
        tests:
          - not_null
      - name: price_scope
        tests:
          - not_null
          - accepted_values:
              values: ['COUNTRY', 'STORE']
      - name: price_type
        tests:
          - not_null
          - accepted_values:
              values: ['STANDARD', 'PROMO']
      - name: is_promo
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: unit_price
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null
      - name: price_id
        tests:
          - not_null
      - name: currency_code
        tests:
          - not_null
