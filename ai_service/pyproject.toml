[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.137.1",
    "groq>=1.4.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "uvicorn[standard]>=0.49.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]  # erreurs, flake, imports
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# 80% measured on 2026-08-26 (uv run pytest --cov=app --cov-report=term-missing)
# is the real baseline this enforces, not an a-priori target — see the
# certification report E3 §5.4 for the module-level
# breakdown and why the RAG indexing / LLM provider adapters sit well below it
# (validated by the manual business-question campaign instead, §5.5).
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
